<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하진이의 사마귀 피하기 🦗</title>
  <style>
    body{
      margin:0; background:#e9f7ff; font-family: Arial, sans-serif;
      text-align:center; user-select:none; -webkit-user-select:none; overflow:hidden;
    }
    h1{ margin:10px 0 6px; font-size:20px; }
    .hint{ font-size:12px; opacity:.75; margin-bottom:10px; }
    #wrap{ display:flex; justify-content:center; padding:0 10px 14px; }
    canvas{
      background:#fff; border:3px solid #333; border-radius:10px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <h1>🦗 하진이의 사마귀 피하기 (점프!)</h1>
  <div class="hint">터치=점프 · Space/↑=점프 · 🥦 먹으면 무적+점프강화+더 빠르게!</div>
  <div id="wrap"><canvas id="game"></canvas></div>

<script>
(() => {
  const NAME = "하진이";

  // 기본 물리
  const BASE_GRAVITY = 0.85;
  const BASE_JUMP_V  = -14.2;

  // 파워업(브로콜리)
  const POWER_MS = 6500;              // 파워업 지속시간
  const POWER_JUMP_V = -16.6;         // 더 강한 점프(더 높이)
  const POWER_GRAVITY = 1.05;         // 더 빨리 내려옴(점프 템포 빨라짐)
  const POWER_SPEED_MULT = 1.25;      // 게임 속도 증가(움직임 빨라짐 느낌)

  // 난이도/스폰
  const BASE_SPEED = 6.2;             // 사마귀 기본 이동 속도
  let spawnMin = 55, spawnMax = 95;

  // 브로콜리 스폰 확률(사마귀가 몇 개 지나갈 때마다 한 번씩 기회)
  const BROC_CHANCE = 0.22;           // 스폰 기회마다 확률
  const BROC_COOLDOWN_MIN_SCORE = 6;  // 초반 너무 빨리 안 나오게

  // 방구 부스터 파티클
  const FART_RATE = 3;                // 점프 중 프레임당 파티클 양

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){
    const margin = 20;
    const headerSpace = 130;
    const vw = Math.min(window.innerWidth - margin, 560);
    const vh = Math.min(window.innerHeight - headerSpace, 820);
    canvas.width = Math.max(300, Math.floor(vw));
    canvas.height = Math.max(420, Math.floor(vh));
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // 하진이 이미지
  const hajinImg = new Image();
  hajinImg.src = "hajin.png";
  let imgReady = false;
  hajinImg.onload = () => imgReady = true;
  hajinImg.onerror = () => imgReady = false;

  // 상태
  let score = 0;
  let best = 0;
  let gameOver = false;

  let powerUntil = 0; // 브로콜리 파워업 종료 시각(ms)

  const GROUND_PAD = 70;
  const groundY = () => canvas.height - GROUND_PAD;

  const player = {
    x: 70,
    y: groundY() - 56,
    w: 56,
    h: 56,
    vy: 0,
    onGround: true
  };

  const obstacles = [];    // 사마귀들
  let spawnTimer = 0;

  let broccoli = null;     // {x,y,w,h,passed}
  const particles = [];    // 방구/스피드 라인 등 {x,y,vx,vy,life,maxLife,emoji,kind}

  function now(){ return performance.now(); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function isPower(){ return now() < powerUntil; }

  function gravity(){ return isPower() ? POWER_GRAVITY : BASE_GRAVITY; }
  function jumpV(){ return isPower() ? POWER_JUMP_V : BASE_JUMP_V; }

  function gameSpeed(){
    // 점수에 따라 조금 빨라지고, 파워업이면 더 빨라짐
    const byScore = BASE_SPEED + Math.min(5, score * 0.05);
    return isPower() ? byScore * POWER_SPEED_MULT : byScore;
  }

  function clampPlayer(){
    player.y = clamp(player.y, 0, groundY() - player.h);
  }

  window.addEventListener("resize", () => {
    resizeCanvas();
    player.y = groundY() - player.h;
    clampPlayer();
  });

  // 점프
  function jump(){
    if (gameOver) { reset(); return; }
    if (!player.onGround) return;
    player.vy = jumpV();
    player.onGround = false;
  }

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === "ArrowUp") jump();
  });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    jump();
  }, { passive:false });

  canvas.addEventListener("mousedown", () => jump());

  // 장애물 생성
  function spawnMantis(){
    const type = Math.random() < 0.75 ? "low" : "mid";
    const size = type === "low" ? 34 : 38;
    const y = type === "low" ? (groundY() - size) : (groundY() - size - 28);
    obstacles.push({
      x: canvas.width + 40,
      y, w: size, h: size,
      passed: false,
      emoji: "🦗"
    });
  }

  function trySpawnBroccoli(){
    if (broccoli) return;
    if (score < BROC_COOLDOWN_MIN_SCORE) return;
    if (Math.random() > BROC_CHANCE) return;

    const size = 34;
    // 바닥 위 살짝
    broccoli = {
      x: canvas.width + 60,
      y: groundY() - size - 6,
      w: size, h: size,
      emoji: "🥦"
    };
  }

  // 충돌
  function hit(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // 파티클(방구)
  function addFartPuff(){
    // 캐릭터 뒤쪽(왼쪽) 아래에서 💨 뿜
    const x = player.x + 8 + rand(-2, 2);
    const y = player.y + player.h - 10 + rand(-6, 2);
    particles.push({
      x, y,
      vx: rand(-2.8, -1.2),
      vy: rand(-0.6, 0.3),
      life: randInt(14, 22),
      maxLife: 22,
      emoji: "💨",
      kind: "fart"
    });
  }

  // 파워업 획득 이펙트
  function addPowerBurst(){
    const emojis = ["✨","🌟","⭐️","💫"];
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;
    for (let i=0;i<20;i++){
      const ang = rand(0, Math.PI*2);
      const spd = rand(0.8, 2.6);
      particles.push({
        x: cx + rand(-10,10),
        y: cy + rand(-10,10),
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - rand(0.1, 1.0),
        life: randInt(18, 30),
        maxLife: 30,
        emoji: emojis[(Math.random()*emojis.length)|0],
        kind: "spark"
      });
    }
  }

  // 리셋
  function reset(){
    score = 0;
    gameOver = false;
    obstacles.length = 0;
    particles.length = 0;
    broccoli = null;
    spawnTimer = 0;
    spawnMin = 55; spawnMax = 95;
    powerUntil = 0;

    player.y = groundY() - player.h;
    player.vy = 0;
    player.onGround = true;

    loop();
  }

  function update(){
    // 난이도: 점수에 따라 스폰 간격 조금씩 줄이기
    if (score !== 0 && score % 15 === 0) {
      spawnMin = Math.max(38, spawnMin - 1);
      spawnMax = Math.max(70, spawnMax - 1);
    }

    // 플레이어 물리
    player.vy += gravity();
    player.y += player.vy;

    if (player.y >= groundY() - player.h) {
      player.y = groundY() - player.h;
      player.vy = 0;
      player.onGround = true;
    }

    // 점프 중 방구 부스터(공중에 있으면 계속)
    if (!player.onGround) {
      for (let i=0; i<FART_RATE; i++) addFartPuff();
    }

    // 스폰
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnMantis();
      spawnTimer = randInt(spawnMin, spawnMax);
    }

    const spd = gameSpeed();

    // 장애물 이동/점수/충돌
    for (let i=obstacles.length-1; i>=0; i--){
      const o = obstacles[i];
      o.x -= spd;

      // 지나가면 점수 +1
      if (!o.passed && o.x + o.w < player.x) {
        o.passed = true;
        score++;
        if (score > best) best = score;

        // 점수 올라갈 때 가끔 브로콜리 스폰 기회
        if (score % 4 === 0) trySpawnBroccoli();
      }

      if (o.x < -80) obstacles.splice(i,1);

      // 충돌(파워업이면 무시)
      const pBox = { x: player.x + 6, y: player.y + 6, w: player.w - 12, h: player.h - 8 };
      const oBox = { x: o.x + 4, y: o.y + 6, w: o.w - 8, h: o.h - 10 };
      if (!isPower() && hit(pBox, oBox)) {
        gameOver = true;
      }
    }

    // 브로콜리 이동/획득
    if (broccoli){
      broccoli.x -= spd;

      const pBox = { x: player.x + 6, y: player.y + 6, w: player.w - 12, h: player.h - 8 };
      const bBox = { x: broccoli.x + 4, y: broccoli.y + 6, w: broccoli.w - 8, h: broccoli.h - 10 };
      if (hit(pBox, bBox)){
        powerUntil = now() + POWER_MS;
        addPowerBurst();
        broccoli = null;
      } else if (broccoli.x < -80){
        broccoli = null;
      }
    }

    // 파티클 업데이트
    for (let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += (p.kind === "spark") ? 0.06 : 0.02;
      p.life -= 1;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // UI
    ctx.font = "16px Arial";
    ctx.fillText(`${NAME} ❤️`, 10, 22);
    ctx.fillText(`점수: ${score}`, canvas.width - 95, 22);
    ctx.fillText(`최고: ${best}`, canvas.width - 95, 44);

    // 파워업 표시
    if (isPower()){
      const left = Math.max(0, Math.ceil((powerUntil - now())/1000));
      ctx.save();
      ctx.font = "bold 16px Arial";
      ctx.fillText(`🥦 파워! 무적 (${left}s)`, 10, 44);
      ctx.restore();
    }

    // 바닥
    ctx.beginPath();
    ctx.moveTo(0, groundY() + 0.5);
    ctx.lineTo(canvas.width, groundY() + 0.5);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#333";
    ctx.stroke();

    // 방구/스파클 파티클
    for (const p of particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = (p.kind === "fart") ? "18px Arial" : "18px Arial";
      ctx.fillText(p.emoji, p.x, p.y);
      ctx.restore();
    }

    // 사마귀
    for (const o of obstacles){
      ctx.font = `${o.w}px Arial`;
      ctx.fillText(o.emoji, o.x, o.y + o.h - 2);
    }

    // 브로콜리
    if (broccoli){
      ctx.font = `${broccoli.w}px Arial`;
      ctx.fillText(broccoli.emoji, broccoli.x, broccoli.y + broccoli.h - 2);
    }

    // 플레이어(하진이)
    if (isPower()){
      // 파워업 때 링 + 반짝 느낌 (선 깜빡)
      const t = now()/120;
      const cx = player.x + player.w/2;
      const cy = player.y + player.h/2;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 2 + Math.abs(Math.sin(t))*5;
      ctx.strokeStyle = "#ffcc00";
      ctx.beginPath();
      ctx.arc(cx, cy, (player.w/2)+12, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    if (imgReady){
      ctx.drawImage(hajinImg, player.x, player.y, player.w, player.h);
    } else {
      ctx.font = "44px Arial";
      ctx.fillText("😀", player.x + 6, player.y + 46);
    }

    // 게임오버
    if (gameOver){
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.font = "bold 24px Arial";
      ctx.fillText("앗! 사마귀에 걸렸다!", 20, canvas.height * 0.45);
      ctx.font = "bold 18px Arial";
      ctx.fillText("터치(또는 스페이스) 하면 다시 시작!", 20, canvas.height * 0.45 + 34);
      ctx.restore();
    }
  }

  function loop(){
    update();
    draw();
    if (!gameOver) requestAnimationFrame(loop);
  }

  // 시작
  loop();
})();
</script>
</body>
</html>
