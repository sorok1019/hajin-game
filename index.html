<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하진이의 응가 피하기 게임 💩</title>
  <style>
    :root { color-scheme: light; }
    body{
      margin:0;
      background:#fff3d6;
      font-family: Arial, sans-serif;
      text-align:center;
      -webkit-user-select:none;
      user-select:none;
      overflow:hidden;
    }
    h1{ margin:10px 0 6px; font-size:20px; }
    #wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 0 10px 14px;
    }
    canvas{
      background:#fff;
      border:3px solid #333;
      border-radius:10px;
      touch-action: manipulation;
    }
    .hint{
      font-size:12px;
      opacity:.75;
      margin-bottom:10px;
    }
  </style>
</head>
<body>
  <h1>💩 하진이의 응가 피하기 게임 💩</h1>
  <div class="hint">왼쪽 터치=왼쪽, 오른쪽 터치=오른쪽 · 🧻 먹으면 5초 무적!</div>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

<script>
(() => {
  const NAME = "하진이";
  const INVINCIBLE_MS = 5000;
  const POOP_BASE_SPEED = 3.2;
  const TISSUE_CHANCE = 0.18;   // 응가 1개가 바닥 도착할 때 휴지 생성 확률
  const SPARKLE_RATE = 3;       // 무적 때 프레임당 반짝 생성량
  const STEP_TOUCH = 42;        // 터치 이동 거리
  const STEP_KEY = 24;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---- 캔버스 크기: 화면에 맞게 자동 조절 ----
  function resizeCanvas(){
    const margin = 20;
    const headerSpace = 130; // 제목+힌트 공간 대략치
    const vw = Math.min(window.innerWidth - margin, 520);
    const vh = Math.min(window.innerHeight - headerSpace, 780);

    canvas.width = Math.max(280, Math.floor(vw));
    canvas.height = Math.max(380, Math.floor(vh));
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // ---- 하진이 이미지 ----
  const hajinImg = new Image();
  hajinImg.src = "hajin.png";
  let imgReady = false;
  hajinImg.onload = () => { imgReady = true; };
  hajinImg.onerror = () => { imgReady = false; };

  // ---- 게임 상태 ----
  let score = 0;
  let gameOver = false;
  let invincibleUntil = 0;

  const player = { x: canvas.width/2 - 28, y: canvas.height - 95, w: 56, h: 56 };

  const poops = [{ x: rand(10, canvas.width - 40), y: -30, size: 30 }];
  let tissue = null; // {x,y,size,speed}

  const sparkles = []; // {x,y,vx,vy,life,maxLife,emoji}

  function now(){ return performance.now(); }
  function isInvincible(){ return now() < invincibleUntil; }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function clampPlayer(){
    player.x = clamp(player.x, 0, canvas.width - player.w);
    player.y = canvas.height - 95;
  }

  // resize 후 플레이어 위치 보정
  window.addEventListener("resize", () => {
    resizeCanvas();
    clampPlayer();
  });

  // ---- 입력 ----
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") player.x -= STEP_KEY;
    if (e.key === "ArrowRight") player.x += STEP_KEY;
    clampPlayer();
  });

  // 터치: 화면 왼쪽/오른쪽으로 이동 (스크롤 방지)
  function handleTouch(clientX){
    const mid = window.innerWidth / 2;
    if (clientX < mid) player.x -= STEP_TOUCH;
    else player.x += STEP_TOUCH;
    clampPlayer();
  }

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    handleTouch(t.clientX);
  }, { passive:false });

  canvas.addEventListener("mousedown", (e) => {
    handleTouch(e.clientX);
  });

  // ---- 스폰/충돌 ----
  function spawnPoop(){
    poops.push({ x: rand(10, canvas.width - 40), y: -40, size: rand(26,34) });
  }

  function maybeSpawnTissue(){
    if (tissue) return;
    if (Math.random() < TISSUE_CHANCE){
      tissue = { x: rand(10, canvas.width - 40), y: -40, size: 30, speed: rand(2.3,3.4) };
    }
  }

  function rectHit(ax, ay, aw, ah, bx, by, bw, bh){
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function addSparkleBurst(cx, cy, count=18){
    const emojis = ["✨","💫","⭐️","🌟"];
    for (let i=0;i<count;i++){
      const ang = rand(0, Math.PI*2);
      const spd = rand(0.8, 2.8);
      sparkles.push({
        x: cx + rand(-10,10),
        y: cy + rand(-10,10),
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - rand(0.2, 1.2),
        life: rand(18, 34),
        maxLife: 34,
        emoji: emojis[(Math.random()*emojis.length)|0]
      });
    }
  }

  function addInvincibleTrail(){
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;
    const emojis = ["✨","💫","⭐️","🌟"];
    for (let i=0;i<SPARKLE_RATE;i++){
      sparkles.push({
        x: cx + rand(-26,26),
        y: cy + rand(-26,26),
        vx: rand(-1.0, 1.0),
        vy: rand(-2.0, -0.2),
        life: rand(14, 24),
        maxLife: 24,
        emoji: emojis[(Math.random()*emojis.length)|0]
      });
    }
  }

  // ---- 루프 ----
  function update(){
    if (gameOver) return;

    // 난이도: 점수에 따라 속도/응가 수 증가
    const poopSpeed = POOP_BASE_SPEED + Math.min(2.2, score * 0.02);

    if (isInvincible()) addInvincibleTrail();

    // 응가 처리
    for (let i=poops.length-1; i>=0; i--){
      const p = poops[i];
      p.y += poopSpeed;

      const hit = rectHit(player.x, player.y, player.w, player.h, p.x, p.y, p.size, p.size);
      if (hit && !isInvincible()){
        gameOver = true;
        alert(`💥 ${NAME} 응가 맞았다!\n점수: ${score}`);
        location.reload();
        return;
      }

      if (p.y > canvas.height + 60){
        poops.splice(i,1);
        score++;
        maybeSpawnTissue();
        if (score % 6 === 0 && poops.length < 4) spawnPoop();
      }
    }
    if (poops.length === 0) spawnPoop();

    // 휴지 처리
    if (tissue){
      tissue.y += tissue.speed;
      const got = rectHit(player.x, player.y, player.w, player.h, tissue.x, tissue.y, tissue.size, tissue.size);
      if (got){
        invincibleUntil = now() + INVINCIBLE_MS;
        addSparkleBurst(player.x + player.w/2, player.y + player.h/2, 26);
        tissue = null;
      } else if (tissue.y > canvas.height + 60){
        tissue = null;
      }
    }

    // 파티클 처리
    for (let i=sparkles.length-1; i>=0; i--){
      const s = sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.06;
      s.life -= 1;
      if (s.life <= 0) sparkles.splice(i,1);
    }

    draw();
    requestAnimationFrame(update);
  }

  function drawPlayer(){
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;

    if (isInvincible()){
      const t = now() / 120;
      const pulse = 2 + Math.abs(Math.sin(t)) * 5;

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = pulse;
      ctx.strokeStyle = "#ffcc00";
      ctx.beginPath();
      ctx.arc(cx, cy, (player.w/2) + 12 + Math.sin(t)*3, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    if (imgReady){
      ctx.drawImage(hajinImg, player.x, player.y, player.w, player.h);
    } else {
      // 이미지가 안 불러와져도 플레이 가능하도록 대체 캐릭터
      ctx.font = "44px Arial";
      ctx.fillText("😀", player.x + 6, player.y + 46);
    }

    if (isInvincible()){
      const left = Math.max(0, Math.ceil((invincibleUntil - now()) / 1000));
      ctx.save();
      ctx.font = "bold 16px Arial";
      ctx.fillText(`무적!! (${left}s)`, clamp(player.x - 6, 6, canvas.width - 120), player.y - 10);
      ctx.restore();
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // UI
    ctx.font = "16px Arial";
    ctx.fillText(`${NAME} ❤️`, 10, 22);
    ctx.fillText(`점수: ${score}`, canvas.width - 90, 22);

    // 응가
    ctx.font = "30px Arial";
    for (const p of poops){
      ctx.fillText("💩", p.x, p.y);
    }

    // 휴지
    if (tissue){
      ctx.font = "30px Arial";
      ctx.fillText("🧻", tissue.x, tissue.y);
    }

    // 플레이어
    drawPlayer();

    // 반짝 파티클
    for (const s of sparkles){
      const a = Math.max(0, s.life / s.maxLife);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = "18px Arial";
      ctx.fillText(s.emoji, s.x, s.y);
      ctx.restore();
    }
  }

  // 시작
  update();
})();
</script>
</body>
</html>
